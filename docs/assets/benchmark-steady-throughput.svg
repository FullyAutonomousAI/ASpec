    <line x1="271" y1="54" x2="271" y2="260" class="grid"/>
    <line x1="382" y1="54" x2="382" y2="260" class="grid"/>
    <line x1="492" y1="54" x2="492" y2="260" class="grid"/>
    <text x="146" y="83" text-anchor="end" class="series">TorchSpec</text>
    <rect x="160" y="65" width="183.1" height="25" rx="2" class="baseline"/>
    <text x="351" y="83" class="value">66.1k</text>
    <text x="146" y="133" text-anchor="end" class="series">SpecForge</text>
    <rect x="160" y="115" width="288.6" height="25" rx="2" class="baseline"/>
    <text x="456" y="133" class="value">104.2k</text>
    <text x="146" y="183" text-anchor="end" class="series">AngelSpec</text>
    <rect x="160" y="165" width="203.7" height="25" rx="2" class="baseline"/>
    <text x="372" y="183" class="value">73.6k</text>
    <text x="146" y="233" text-anchor="end" class="series" font-weight="600">ASpec</text>
    <rect x="160" y="215" width="335.8" height="25" rx="2" class="aspec"/>
    <text x="503" y="233" class="value">121.2k</text>
    <line x1="160" y1="260" x2="520" y2="260" class="axis"/>
    <text x="160" y="283" text-anchor="middle" class="tick">0</text>
    <text x="271" y="283" text-anchor="middle" class="tick">40k</text>
    <text x="382" y="283" text-anchor="middle" class="tick">80k</text>
    <text x="492" y="283" text-anchor="middle" class="tick">120k</text>
    <text x="340" y="308" text-anchor="middle" class="tick">input tokens/s</text>
  </g>

  <!-- Qwen3.8-27B / 4K -->
  <g transform="translate(40 480)">
    <rect x="0" y="0" width="540" height="320" rx="8" fill="#FFFFFF" stroke="#D9E0E8"/>
    <text x="22" y="34" class="panel-title">Qwen3.8-27B / 4K</text>
    <line x1="160" y1="54" x2="160" y2="260" class="axis"/>
    <line x1="271" y1="54" x2="271" y2="260" class="grid"/>
    <line x1="382" y1="54" x2="382" y2="260" class="grid"/>
    <line x1="492" y1="54" x2="492" y2="260" class="grid"/>
    <text x="146" y="83" text-anchor="end" class="series">TorchSpec</text>
    <rect x="160" y="65" width="61.5" height="25" rx="2" class="baseline"/>
    <text x="229" y="83" class="value">22.2k</text>
    <text x="146" y="133" text-anchor="end" class="series">SpecForge</text>
    <rect x="160" y="115" width="57.3" height="25" rx="2" class="baseline"/>
    <text x="225" y="133" class="value">20.7k</text>
    <text x="146" y="183" text-anchor="end" class="series">AngelSpec</text>
    <rect x="160" y="165" width="51.5" height="25" rx="2" class="baseline"/>
    <text x="219" y="183" class="value">18.6k</text>
    <text x="146" y="233" text-anchor="end" class="series" font-weight="600">ASpec</text>
    <rect x="160" y="215" width="94.0" height="25" rx="2" class="aspec"/>
    <text x="262" y="233" class="value">33.9k</text>
    <line x1="160" y1="260" x2="520" y2="260" class="axis"/>
    <text x="160" y="283" text-anchor="middle" class="tick">0</text>
    <text x="271" y="283" text-anchor="middle" class="tick">40k</text>
    <text x="382" y="283" text-anchor="middle" class="tick">80k</text>
    <text x="492" y="283" text-anchor="middle" class="tick">120k</text>
    <text x="340" y="308" text-anchor="middle" class="tick">input tokens/s</text>
  </g>

  <!-- Qwen3.8-27B / 256K -->
  <g transform="translate(620 480)">
    <rect x="0" y="0" width="540" height="320" rx="8" fill="#FFFFFF" stroke="#D9E0E8"/>
    <text x="22" y="34" class="panel-title">Qwen3.8-27B / 256K</text>
    <line x1="160" y1="54" x2="160" y2="260" class="axis"/>
    <line x1="271" y1="54" x2="271" y2="260" class="grid"/>
    <line x1="382" y1="54" x2="382" y2="260" class="grid"/>
    <line x1="492" y1="54" x2="492" y2="260" class="grid"/>
    <text x="146" y="83" text-anchor="end" class="series">TorchSpec</text>
    <rect x="160" y="65" width="63.5" height="25" rx="2" class="baseline"/>
    <text x="231" y="83" class="value">22.9k</text>
    <text x="146" y="133" text-anchor="end" class="series">SpecForge</text>
    <rect x="160" y="115" width="90.7" height="25" rx="2" class="baseline"/>
    <text x="259" y="133" class="value">32.7k</text>
    <text x="146" y="183" text-anchor="end" class="series">AngelSpec</text>
    <text x="160" y="183" class="tick" font-style="italic">No complete result</text>
    <text x="146" y="233" text-anchor="end" class="series" font-weight="600">ASpec</text>
    <rect x="160" y="215" width="99.2" height="25" rx="2" class="aspec"/>
    <text x="267" y="233" class="value">35.8k</text>
    <line x1="160" y1="260" x2="520" y2="260" class="axis"/>
    <text x="160" y="283" text-anchor="middle" class="tick">0</text>
    <text x="271" y="283" text-anchor="middle" class="tick">40k</text>
    <text x="382" y="283" text-anchor="middle" class="tick">80k</text>
    <text x="492" y="283" text-anchor="middle" class="tick">120k</text>
    <text x="340" y="308" text-anchor="middle" class="tick">input tokens/s</text>
  </g>

  <text x="40" y="834" fill="#697586" font-size="14">Bars use the same scale across panels. Values are rounded only for labels; the table retains full precision.</text>
</svg>
