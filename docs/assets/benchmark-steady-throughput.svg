<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end steady-window training throughput</title>
  <desc id="desc">Four horizontal bar-chart panels compare TorchSpec, SpecForge, AngelSpec, and ASpec on Qwen3-8B 4K, Qwen3-8B 128K, Qwen3.8-27B 4K, and Qwen3.8-27B 256K. ASpec has the highest measured throughput in every workload. AngelSpec has no complete result for Qwen3.8-27B 256K.</desc>
  <metadata>{"source":"docs/benchmarks/results.md","metric":"committed training input tokens per second","window":"steady window from completion of warmup update eight through final optimizer completion","maximum":130000,"workloads":[{"name":"Qwen3-8B / 4K","TorchSpec":34080.95,"SpecForge":31063.56,"AngelSpec":28952.97,"ASpec":77721.37},{"name":"Qwen3-8B / 128K","TorchSpec":66103.68,"SpecForge":104216.51,"AngelSpec":73561.63,"ASpec":121237.15},{"name":"Qwen3.8-27B / 4K","TorchSpec":22223.87,"SpecForge":20681.76,"AngelSpec":18593.31,"ASpec":33926.93},{"name":"Qwen3.8-27B / 256K","TorchSpec":22940.76,"SpecForge":32743.82,"AngelSpec":null,"ASpec":35805.46}]}</metadata>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-variant-numeric: tabular-nums; }
      .panel-title { fill: #202939; font-size: 21px; font-weight: 600; }
      .series { fill: #364152; font-size: 15px; }
      .value { fill: #364152; font-size: 14px; font-weight: 600; }
      .tick { fill: #697586; font-size: 13px; }
      .grid { stroke: #E4E7EC; stroke-width: 1; }
      .axis { stroke: #CDD5DF; stroke-width: 1; }
      .baseline { fill: #98A2B3; }
      .aspec { fill: #2F6BFF; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="#FFFFFF"/>
  <text id="chart-heading" x="40" y="50" fill="#202939" font-size="30" font-weight="600">End-to-end steady-window throughput</text>
  <text x="40" y="80" fill="#697586" font-size="16">Committed training input tokens per second · one 8×H200 node · shared 0–130k scale</text>
  <rect x="879" y="37" width="18" height="18" rx="2" class="baseline"/>
  <text x="906" y="52" fill="#364152" font-size="15">Baseline framework</text>
  <rect x="1065" y="37" width="18" height="18" rx="2" class="aspec"/>
  <text x="1092" y="52" fill="#364152" font-size="15">ASpec</text>

  <!-- Qwen3-8B / 4K -->
  <g transform="translate(40 120)">
    <rect x="0" y="0" width="540" height="320" rx="8" fill="#FFFFFF" stroke="#D9E0E8"/>
    <text x="22" y="34" class="panel-title">Qwen3-8B / 4K</text>
    <line x1="160" y1="54" x2="160" y2="260" class="axis"/>
    <line x1="271" y1="54" x2="271" y2="260" class="grid"/>
    <line x1="382" y1="54" x2="382" y2="260" class="grid"/>
    <line x1="492" y1="54" x2="492" y2="260" class="grid"/>
    <text x="146" y="83" text-anchor="end" class="series">TorchSpec</text>
    <rect x="160" y="65" width="94.4" height="25" rx="2" class="baseline"/>
    <text x="262" y="83" class="value">34.1k</text>
    <text x="146" y="133" text-anchor="end" class="series">SpecForge</text>
    <rect x="160" y="115" width="86.0" height="25" rx="2" class="baseline"/>
    <text x="254" y="133" class="value">31.1k</text>
    <text x="146" y="183" text-anchor="end" class="series">AngelSpec</text>
    <rect x="160" y="165" width="80.2" height="25" rx="2" class="baseline"/>
    <text x="248" y="183" class="value">29.0k</text>
    <text x="146" y="233" text-anchor="end" class="series" font-weight="600">ASpec</text>
    <rect x="160" y="215" width="215.2" height="25" rx="2" class="aspec"/>
    <text x="383" y="233" class="value">77.7k</text>
    <line x1="160" y1="260" x2="520" y2="260" class="axis"/>
    <text x="160" y="283" text-anchor="middle" class="tick">0</text>
    <text x="271" y="283" text-anchor="middle" class="tick">40k</text>
    <text x="382" y="283" text-anchor="middle" class="tick">80k</text>
    <text x="492" y="283" text-anchor="middle" class="tick">120k</text>
    <text x="340" y="308" text-anchor="middle" class="tick">input tokens/s</text>
  </g>

  <!-- Qwen3-8B / 128K -->
  <g transform="translate(620 120)">
    <rect x="0" y="0" width="540" height="320" rx="8" fill="#FFFFFF" stroke="#D9E0E8"/>
