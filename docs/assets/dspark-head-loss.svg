<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
<title id="title">DSpark LM Head and L1 Loss: Reuse Logits, Rebuild Softmax Tiles</title>
<desc id="desc">Left: repeated Target projections versus budgeted full-context logits reuse. Right: tiled L1 over the full vocabulary and backward softmax reconstruction. Eight FP32 scalars per prediction position cover replay statistics only, excluding logits and temporary workspace.</desc>
<metadata>{&quot;scope&quot;:&quot;Conceptual diagram, not measured memory sizes or throughput.&quot;,&quot;sources&quot;:[&quot;aspec/models/dspark.py&quot;,&quot;aspec/models/ops/tiled_l1.py&quot;],&quot;projection_reuse&quot;:&quot;Full-context frozen Target projection shown; CP1, bounded budget and lower projection work required. Budgeted chunk caching may retain Target and Draft logits. All reuse is within one forward/backward.&quot;,&quot;loss&quot;:&quot;Tiled L1 with full-vocabulary FP32 normalization; reconstruct softmax tiles from logits and statistics during backward.&quot;,&quot;replay_statistics&quot;:&quot;8 FP32 scalars per prediction row (4 normalization, 3 sign-group masses, 1 loss); excludes logits and temporary workspace.&quot;}</metadata>
