# Supplementary staged DSA example, not a convergence or throughput claim.
# Dense -> indexer_warmup -> sparse; see docs/user-guide/structures.md.
model:
  target_model_path: Qwen/Qwen3-8B
  native_context_length: 32768
  trust_remote_code: false
  draft_model_config: aspec/config/dspark_qwen3_8b_dsa_dense_draft_config.json

dataset:
  train_data_path: ../../examples/data/sample_conversations.jsonl
  chat_template: qwen
  shuffle_dataset: false
  min_loss_tokens: 32

training:
  attention_backend: fa4
  draft_context_parallel_size: 1
  dflash_packing: true
  compile_model: false
  micro_batch_size: 1
  draft_accumulation_steps: 1
  training_num_gpus_per_node: 1
  training_num_nodes: 1
  fsdp_strategy: REPLICATE
  placement_strategy: inference_first
  max_seq_length: 4096
  num_train_steps: 16
  lr_total_steps: 16
  learning_rate: 0.0006
  min_lr: 0.00006
  dspark_num_anchors: 512
  ttt_length: 7
  dflash_block_size: 7
  streaming_dispatch_with_training: true
  pipeline_dispatch_with_training: true
  prefetch_depth: 1
  save_interval: 8
  save_final_checkpoint: true

inference:
  inference_engine_type: sgl
  store_last_hidden_states: true
  target_prefill_memory_optimized: false
  inference_num_gpus: 1
  inference_num_gpus_per_engine: 1
  inference_num_gpus_per_node: 2
  inference_batch_size: 1
  inference_fetch_batch: 2
  inference_buffer_threshold: 2
  max_sample_pool_size: 4
  sglang:
    tp_size: 1
    mem_fraction_static: 0.5

mooncake:
  data_plane: transfer_engine
  protocol: nvlink_intra
  require_nvlink: true
  enable_gpu_direct: true
  allow_host_fallback: false
  hidden_dim: 4096
  max_seq_len: 4096
  source_gpu_ring_slots: 2
  destination_gpu_ring_slots: 1
  gpu_ring_slots: 2
  local_buffer_size: 4GB
  global_segment_size: 8GB
  host_buffer_size: 1GB

logging:
  report_to: none

output_dir: outputs/qwen3-8b-dsa-dense
cache_dir: cache/qwen3-8b-dsa
