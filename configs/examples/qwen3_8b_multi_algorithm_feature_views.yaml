# Supplementary configuration example; see the support matrix for supported workflows.
# Inspect its inputs, step limits and support boundary before use.
# One Target captures a six-layer union; drafts consume independent five/three/two-layer views.
# Eight-GPU example; 16 steps validate function/lifecycle, not quality or speed.
model:
  target_model_path: Qwen/Qwen3-8B
  native_context_length: 32768
  trust_remote_code: false
  draft_model_config: aspec/config/dspark_draft_config.json
dataset:
  train_data_path: ../../examples/data/sample_conversations.jsonl
  eval_data_path: null
  chat_template: qwen
  prompt_key: conversations
  min_loss_tokens: 32
  shuffle_dataset: false
  dataset_seed: 42
training:
  attention_backend: fa4
  draft_context_parallel_size: 1
  micro_batch_size: 1
  draft_accumulation_steps: 2
  learning_rate: 6e-4
  min_lr: 6e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_length: 4096
  num_epochs: 100
  num_train_steps: 16
  lr_total_steps: 32
  warmup_ratio: 0.04
  seed: 42
  continual_training: false
  deterministic_anchor_sampling: false
  training_num_gpus_per_node: 1
  training_num_nodes: 1
  placement_strategy: inference_first
  fsdp_strategy: REPLICATE
  fsdp_reduce_dtype: bfloat16
  compile_model: false
  max_concurrent_batches: 1
  streaming_dispatch_with_training: true
  pipeline_dispatch_with_training: true
  prefetch_depth: 1
  save_interval: 8
  save_per_epoch: false
  save_final_checkpoint: true
  max_checkpoints: 2
  dflash_block_size: 7
  dflash_packing: true
  dspark_num_anchors: 512
  dspark_num_target_layers: 5
  dspark_loss_decay_gamma: 4.0
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
inference:
  inference_engine_type: sgl
  store_last_hidden_states: true
  target_prefill_memory_optimized: true
  inference_num_gpus: 1
  inference_num_gpus_per_engine: 1
  inference_num_gpus_per_node: 8
  inference_fetch_batch: 4
  inference_buffer_threshold: 4
  max_sample_pool_size: 8
  inference_batch_size: 2
  sglang:
    tp_size: 1
    mem_fraction_static: 0.5
mooncake:
  data_plane: transfer_engine
  protocol: nvlink_intra
  require_nvlink: true
  enable_gpu_direct: true
  allow_host_fallback: false
  enable_hard_pin: true
  max_seq_len: 4096
  hidden_dim: 4096
  global_segment_size: 32GB
  local_buffer_size: 8GB
  host_buffer_size: 1GB
  gpu_ring_slots: 8
  source_gpu_ring_slots: 8
  destination_gpu_ring_slots: 1
  kv_lease_ttl_s: 600
  get_retry_max_wait_seconds: 600
logging:
  report_to: none
debug:
  enable_perf_metrics: true
output_dir: outputs/qwen3-8b-multi-algorithm-feature-views
cache_dir: cache/qwen3-8b-multi-algorithm-feature-views
experiments:
- name: dspark_cp1
  training:
    training_num_gpus_per_node: 1
    draft_context_parallel_size: 1
    dflash_packing: false
- name: eagle3_cp2
  model:
    draft_model_config: aspec/config/eagle3_qwen3_8b_pruned_draft_config.json
  training:
    training_num_gpus_per_node: 2
    draft_context_parallel_size: 2
    ttt_length: 3
    loss_type: forward_kl
    gradient_checkpointing: true
- name: dflash_cp4
  model:
    draft_model_config: aspec/config/dflash_qwen3_8b_two_feature_draft_config.json
  training:
    training_num_gpus_per_node: 4
    draft_context_parallel_size: 4
    dflash_num_target_layers: 2
    dflash_num_anchors: 512
