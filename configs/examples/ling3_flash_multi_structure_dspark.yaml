# Supplementary configuration example; see the support matrix for supported workflows.
# Inspect its inputs, step limits and support boundary before use.
# One Ling Target, three independently initialized DSpark Draft structures.
# Run from the repository root; see docs/user-guide/structures.md.
# 2 Target GPUs + 1 GPU per Draft = 5 GPUs on one NVLink node.
# Functional comparison, not a quality-trained checkpoint or speed claim.
model:
  target_model_path: inclusionAI/Ling-3.0-flash
  native_context_length: 262144
  trust_remote_code: true
  draft_model_config: aspec/config/dspark_ling3_flash_draft_config.json
  embedding_key: model.word_embeddings.weight
  lm_head_key: lm_head.weight
  norm_key: model.norm.weight

dataset:
  train_data_path: ../../examples/data/sample_conversations.jsonl
  eval_data_path: null
  chat_template: ling3
  prompt_key: conversations
  min_loss_tokens: 32
  shuffle_dataset: false
  dataset_seed: 42

training:
  attention_backend: cudnn_flex_attention
  draft_context_parallel_size: 1
  micro_batch_size: 1
  draft_accumulation_steps: 4
  training_num_gpus_per_node: 1
  training_num_nodes: 1
  placement_strategy: inference_first
  fsdp_strategy: REPLICATE
  fsdp_reduce_dtype: bfloat16
  learning_rate: 6e-4
  min_lr: 6e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_length: 4096
  num_epochs: 100
  num_train_steps: 16
  # Fixed in advance, including the documented resume from step 16 to step 18.
  lr_total_steps: 32
  warmup_ratio: 0.04
  seed: 42
  continual_training: false
  deterministic_anchor_sampling: false
  max_concurrent_batches: 1
  streaming_dispatch_with_training: true
  pipeline_dispatch_with_training: true
  prefetch_depth: 1
  save_interval: 8
  save_per_epoch: false
  save_final_checkpoint: true
  max_checkpoints: 2
  dflash_block_size: 8
  dflash_packing: false
  dspark_num_anchors: 512
  dspark_num_target_layers: 5
  dspark_loss_decay_gamma: 4.0
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0

inference:
  inference_engine_type: sgl
  store_last_hidden_states: true
  # Ling uses the native feature hook, not the Qwen direct-prefill path.
  target_prefill_memory_optimized: false
  inference_num_gpus: 2
  inference_num_gpus_per_engine: 2
  inference_num_gpus_per_node: 8
  inference_fetch_batch: 8
  inference_buffer_threshold: 2
  max_sample_pool_size: 16
  inference_batch_size: 2
  sglang:
    init_timeout: 1200
    tp_size: 2
    mem_fraction_static: 0.9

mooncake:
  data_plane: transfer_engine
  protocol: nvlink_intra
  require_nvlink: true
  enable_gpu_direct: true
  allow_host_fallback: false
  enable_hard_pin: true
  max_seq_len: 4096
  hidden_dim: 2560
  global_segment_size: 16GB
  local_buffer_size: 4GB
  host_buffer_size: 1GB
  gpu_ring_slots: 16
  source_gpu_ring_slots: 16
  destination_gpu_ring_slots: 1
  kv_lease_ttl_s: 600
  get_retry_max_wait_seconds: 600

# All three use the common seed, GBS and main DSpark objective.
# For exact resume, replace EACH null below with that experiment's
# published checkpoint directory, and choose a NEW output_dir.
experiments:
  - name: dense
    model:
      draft_model_config: aspec/config/dspark_ling3_flash_draft_config.json
    training:
      load_path: null
  - name: qwen_moe
    model:
      draft_model_config: aspec/config/dspark_ling3_flash_qwen_moe_draft_config.json
    training:
      load_path: null
  - name: ling_moe
    model:
      draft_model_config: aspec/config/dspark_ling3_flash_moe_draft_config.json
    training:
      load_path: null

logging:
  report_to: none
debug:
  enable_perf_metrics: true
output_dir: outputs/ling3-flash-multi-structure
cache_dir: cache/ling3-flash-multi-structure
