# Release training starting point: three passes, held-out eval and checkpoints.
# Hyperparameters are not a convergence/quality claim; see docs/user-guide/recipes.md.
# Single-node training, resume and export configuration.
model:
  target_model_path: ${oc.env:ASPEC_TARGET_MODEL,Qwen/Qwen3-8B}
  native_context_length: 32768
  trust_remote_code: false
  draft_model_config: aspec/config/eagle4_qwen3_8b_draft_config.json
dataset:
  eval_interval: 100
  eval_micro_batch_size: 1
  train_data_path: ${oc.env:ASPEC_TRAIN_DATA}
  eval_data_path: ${oc.env:ASPEC_EVAL_DATA}
  chat_template: qwen
  prompt_key: conversations
  min_loss_tokens: 1
  shuffle_dataset: true
  dataset_seed: 42
training:
  attention_backend: fa4
  draft_context_parallel_size: 1
  micro_batch_size: 1
  draft_accumulation_steps: 2
  learning_rate: 6e-4
  min_lr: 6e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_length: 4096
  num_epochs: 3
  warmup_ratio: 0.04
  seed: 42
  continual_training: false
  deterministic_anchor_sampling: false
  training_num_gpus_per_node: 2
  training_num_nodes: 1
  placement_strategy: inference_first
  fsdp_strategy: REPLICATE
  fsdp_reduce_dtype: bfloat16
  compile_model: false
  max_concurrent_batches: 1
  streaming_dispatch_with_training: true
  pipeline_dispatch_with_training: true
  prefetch_depth: 1
  save_interval: 100
  save_per_epoch: false
  save_final_checkpoint: true
  max_checkpoints: 2
  dflash_packing: true
  ttt_length: 3
  gradient_checkpointing: true
  loss_type: forward_kl
  ploss_weights:
  - 1.0
  - 0.8
  - 0.64
inference:
  inference_engine_type: sgl
  store_last_hidden_states: true
  target_prefill_memory_optimized: true
  inference_num_gpus: 1
  inference_num_gpus_per_engine: 1
  inference_num_gpus_per_node: 3
  inference_fetch_batch: 4
  inference_buffer_threshold: 4
  max_sample_pool_size: 8
  inference_batch_size: 2
  sglang:
    tp_size: 1
    mem_fraction_static: 0.5
mooncake:
  data_plane: transfer_engine
  protocol: nvlink_intra
  require_nvlink: true
  enable_gpu_direct: true
  allow_host_fallback: false
  enable_hard_pin: true
  max_seq_len: 4096
  hidden_dim: 4096
  global_segment_size: 32GB
  local_buffer_size: 8GB
  host_buffer_size: 1GB
  gpu_ring_slots: 8
  source_gpu_ring_slots: 8
  destination_gpu_ring_slots: 1
  kv_lease_ttl_s: 600
  get_retry_max_wait_seconds: 600
logging:
  report_to: none
debug:
  enable_perf_metrics: true
output_dir: outputs/qwen3-8b-eagle4
cache_dir: cache/qwen3-8b-eagle4
