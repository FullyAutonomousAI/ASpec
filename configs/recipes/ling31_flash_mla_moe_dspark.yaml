# Release training starting point: three passes, held-out eval and checkpoints.
# Hyperparameters are not a convergence/quality claim; see docs/user-guide/recipes.md.
# Official Ling-3.1-flash FP8 Target + independently initialized MLA/Ling-MoE Draft.
# The materialized MLA Draft is NOT a copy of the Target's hybrid KDA architecture.
# Re-tokenize the selected original answers with Ling; never reuse Qwen token IDs.
model:
  target_model_path: ${oc.env:ASPEC_TARGET_MODEL,inclusionAI/Ling-3.1-flash}
  native_context_length: 262144
  trust_remote_code: true
  draft_model_config: aspec/config/dspark_ling31_flash_mla_moe_draft_config.json
  embedding_key: model.word_embeddings.weight
  lm_head_key: lm_head.weight
  norm_key: model.norm.weight
dataset:
  # FP8 first-use kernel compilation can outlast the normal 300-second idle budget.
  eval_cache_idle_timeout_seconds: 1200
  eval_interval: 100
  eval_micro_batch_size: 1
  train_data_path: ${oc.env:ASPEC_TRAIN_DATA}
  eval_data_path: ${oc.env:ASPEC_EVAL_DATA}
  chat_template: null
  min_loss_tokens: 16
  last_turn_loss_only: false
  shuffle_dataset: true
  dataset_seed: 42
training:
  attention_backend: cudnn_flex_attention
  draft_context_parallel_size: 1
  micro_batch_size: 1
  draft_accumulation_steps: 4
  learning_rate: 6e-4
  min_lr: 6e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_length: 4096
  num_epochs: 3
  warmup_ratio: 0.04
  seed: 42
  compile_model: false
  training_num_gpus_per_node: 4
  training_num_nodes: 1
  placement_strategy: inference_first
  fsdp_strategy: REPLICATE
  fsdp_reduce_dtype: bfloat16
  max_concurrent_batches: 1
  streaming_dispatch_with_training: true
  # Target-bound: stream current-step work; next-step prefix dispatch was not observed.
  pipeline_dispatch_with_training: false
  prefetch_depth: 1
  save_interval: 100
  save_per_epoch: false
  save_final_checkpoint: true
  max_checkpoints: 2
  dflash_block_size: 8
  dflash_packing: true
  # The source ring retains four samples; do not wait for a larger pool.
  packing_min_samples_per_dispatch: 4
  dspark_num_anchors: 512
  dspark_num_target_layers: 5
  dspark_loss_decay_gamma: 4.0
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
inference:
  inference_engine_type: sgl
  store_last_hidden_states: true
  target_prefill_memory_optimized: false
  inference_num_gpus: 4
  inference_num_gpus_per_engine: 4
  inference_num_gpus_per_node: 8
  inference_fetch_batch: 8
  inference_buffer_threshold: 16
  max_sample_pool_size: 64
  inference_batch_size: 1
  sglang:
    init_timeout: 1200
    tp_size: 4
    # FP8 Target weights occupy most of four 140-GiB devices.
    mem_fraction_static: 0.98
    extra_args:
      ep_size: 4
      max_running_requests: 1
      max_total_tokens: 8192
      max_prefill_tokens: 4096
mooncake:
  data_plane: transfer_engine
  protocol: nvlink_intra
  require_nvlink: true
  enable_gpu_direct: true
  allow_host_fallback: false
  enable_hard_pin: true
  max_seq_len: 4096
  hidden_dim: 4096
  global_segment_size: 32GB
  local_buffer_size: 4GB
  host_buffer_size: 4GB
  gpu_ring_slots: 4
  source_gpu_ring_slots: 4
  destination_gpu_ring_slots: 1
  kv_lease_ttl_s: 600
  get_retry_max_wait_seconds: 600
logging:
  report_to: none
debug:
  enable_perf_metrics: true
output_dir: outputs/ling31-flash-mla-moe-dspark
cache_dir: cache/ling31-flash-mla-moe-dspark
