# Native 128K comparison: 7 Target + 1 Draft, four physical rows/step.
model:
  target_model_path: ${oc.env:BENCH_TARGET_MODEL}
  trust_remote_code: true
  initial_draft_model_path: ${oc.env:BENCH_INITIAL_DRAFT}
  draft_model_config: ${oc.env:TORCHSPEC_CHECKOUT}/torchspec/config/dspark_draft_config.json
dataset:
  train_data_path: ${oc.env:BENCH_TRAIN_DATA}
  chat_template: null
  eval_data_path: null
  min_loss_tokens: 32
  last_turn_loss_only: false
  shuffle_dataset: false
training:
  learning_rate: 0.0006
  min_lr: 6.0e-05
  weight_decay: 0
  max_grad_norm: 1
  fsdp_strategy: REPLICATE
  fsdp_reduce_dtype: bfloat16
  training_num_gpus_per_node: 1
  training_num_nodes: 1
  num_train_steps: 40
  num_epochs: 100
  lr_total_steps: 1000
  warmup_ratio: 0.04
  max_seq_length: 131072
  prefetch_depth: 8
  max_concurrent_batches: 1
  seed: 42
  compile_model: false
  save_interval: 0
  save_per_epoch: false
  dflash_block_size: 7
  dspark_num_anchors: 512
  dspark_num_target_layers: 5
  dspark_loss_decay_gamma: 4
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1
  attention_backend: flex_attention
  micro_batch_size: 1
  draft_accumulation_steps: 4
inference:
  inference_engine_type: sgl
  store_last_hidden_states: true
  inference_num_gpus: 7
  inference_num_gpus_per_engine: 1
  inference_num_gpus_per_node: 7
  inference_batch_size: 1
  inference_buffer_threshold: 8
  max_sample_pool_size: 16
  sglang:
    tp_size: 1
    mem_fraction_static: 0.7
    extra_args:
      max_running_requests: 1
      max_total_tokens: 131328
      max_prefill_tokens: 131328
      json_model_override_args: '{"rope_scaling":{"rope_type":"yarn","factor":4.0,"original_max_position_embeddings":32768,"rope_theta":1000000.0},"max_position_embeddings":131072}'
mooncake:
  protocol: tcp
  enable_hard_pin: true
  global_segment_size: 48GB
  host_buffer_size: 16GB
  local_buffer_size: 8GB
  max_seq_len: 131072
  hidden_dim: 4096
  kv_lease_ttl_s: 600
  get_retry_max_wait_seconds: 600
logging:
  report_to: none
debug:
  enable_perf_metrics: true
output_dir: ${oc.env:BENCH_OUTPUT}
cache_dir: ${oc.env:BENCH_CACHE}
